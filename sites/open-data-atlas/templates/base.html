<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="canonical" href="{{ canonical_url(site.base_url, page_path) }}">
  <link rel="stylesheet" href="{{ link('styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ link('') }}">{{ site.name }}</a>
    <nav aria-label="Primary"><a href="{{ link('') }}">Home</a><a href="{{ link('methodology/') }}">Methodology</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><p>Public indicator data from the <a href="https://data.worldbank.org/">World Bank</a>. <a href="{{ link('methodology/') }}">How this site works</a>.</p></footer>
</body>
</html>
