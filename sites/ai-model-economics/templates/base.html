<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="canonical" href="{{ canonical_url(site.base_url, page_path) }}">
  <link rel="stylesheet" href="{{ link('styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ link('') }}">AI Model Economics</a>
    <nav aria-label="Primary"><a href="{{ link('') }}">Models</a><a href="{{ link('models/rankings/input-cost/') }}">Rankings</a><a href="{{ link('methodology/') }}">Methodology</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><p>Curated from official provider sources. Prices are point-in-time API list prices; terms and availability can change. <a href="{{ link('methodology/') }}">Methods and limitations</a>.</p></footer>
</body>
</html>
