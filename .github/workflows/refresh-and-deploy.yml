name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Refresh data and build site
        run: |
          python scripts/build.py
          python scripts/build_ai_model_economics.py
      - name: Run tests and validation
        run: |
          git diff --exit-code -- data/curated/model_facts.csv
          python -m unittest discover -s tests
          python scripts/validate.py
          python scripts/validate_ai_model_economics.py
      - name: Commit refreshed generated artifacts
        run: |
          if [[ -z "$(git status --porcelain -- data/generated site)" ]]; then
            echo "No generated changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/generated site
            git commit -m "chore(data): refresh generated World Bank snapshot"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
